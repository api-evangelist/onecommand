name: OneCommand
description: OneCommand is a cloud-based customer marketing and loyalty-automation platform built for
  automotive dealerships. Founded in 1999 and headquartered in Mason, Ohio, it helps dealers drive
  service and sales traffic, increase owner retention, and lower marketing costs through data-driven,
  multichannel outreach across voice, text, email, and direct mail. Its product family includes the
  OneCommand loyalty-automation platform, the Higher Gear CRM, and the TrafficAccelerator service.
  OneCommand was acquired by Affinitiv and its capabilities are now part of Karmotive, a CDK Global
  company. OneCommand operates as a marketing-services provider and does not publish a public developer
  API, developer portal, SDKs, or API documentation.
